<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7</title>

    <style>
        input {
            padding: 5px;
        }

        button {
            background-color: lightblue;
            margin: 5px 10px;
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #000;
        }

        .container {
            text-align: center;
        }

        #elid {
            position: relative;
            left: 0;
            margin: 10px auto;
            width: 200px;
            height: 200px;
            background-color: blue;
            border: 2px solid #000;
            transition: left 1s;
        }
    </style>
</head>

<body>
    <input id="countyInput" type="text">
    <button onclick="searchCounty()">Знайти код</button>
    <p id="result"></p>

    <hr>

    <form action="#">
        <input type="text" placeholder="First Name" id="first-name" required>
        <input type="text" placeholder="Last Name" id="last-name">
        <input type="email" placeholder="Email" id="email">
        <button type="submit" id="submit-button">Відправити</button>
    </form>

    <hr>

    <div class="container">
        <div id="elid"></div>
        <button id="left-one" onclick="leftSlide()">Вліво</button>
        <button id="right-one" onclick="rightSlide()">Вправо</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
