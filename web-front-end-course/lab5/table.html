<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-4">
    <div class="flex gap-4 my-4">
        <p class="text-gray-400 mr-auto">
            <span>0</span> selected
        </p>
        <button class="flex gap-2 items-center cursor-pointer">
            <div class="w-6 h-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="current" height="current" viewBox="0 0 24 24">
                    <path fill="currentColor" fill-rule="evenodd"
                        d="M22.75 7a.75.75 0 0 1-.75.75H2a.75.75 0 0 1 0-1.5h20a.75.75 0 0 1 .75.75m-3 5a.75.75 0 0 1-.75.75H5a.75.75 0 0 1 0-1.5h14a.75.75 0 0 1 .75.75m-3 5a.75.75 0 0 1-.75.75H8a.75.75 0 0 1 0-1.5h8a.75.75 0 0 1 .75.75"
                        clip-rule="evenodd" />
                </svg>
            </div>

            <span>Sort by</span>
        </button>
        <button class="flex gap-2 items-center cursor-pointer">
            ⋮
            <span>Actions</span>
        </button>
    </div>
    <div class="border border-gray-100 rounded-lg">
        <div class="overflow-x-auto">
            <table class="w-full text-sm md:text-base">
                <thead class="bg-gray-100 font-normal">
                    <tr>
                        <th class="px-3 py-2 w-20">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                            <button class="w-3 h-3 cursor-pointer mx-2">
                                <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="current"
                                    height="current" shape-rendering="geometricPrecision"
                                    text-rendering="geometricPrecision" image-rendering="optimizeQuality"
                                    fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 512 298.04">
                                    <path fill-rule="nonzero"
                                        d="M12.08 70.78c-16.17-16.24-16.09-42.54.15-58.7 16.25-16.17 42.54-16.09 58.71.15L256 197.76 441.06 12.23c16.17-16.24 42.46-16.32 58.71-.15 16.24 16.16 16.32 42.46.15 58.7L285.27 285.96c-16.24 16.17-42.54 16.09-58.7-.15L12.08 70.78z" />
                                </svg>
                            </button>
                        </th>
                        <th class="px-4 py-2 font-normal text-left text-gray-500">Name</th>
                        <th class="px-4 py-2 font-normal text-right text-gray-500">Properties</th>
                        <th class="px-4 py-2 font-normal text-right text-gray-500">Created by</th>
                        <th class="px-4 py-2 font-normal text-left text-gray-500">Last updated</th>
                        <th class="px-4 py-2 font-normal text-right text-gray-500"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-b border-gray-100">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                        </td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">denver</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">24</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">Me</td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">02/27/2026 at 1:41PM</td>
                        <td class="px-2 py-2 text-right border-b border-gray-100 cursor-pointer pr-4">
                            ⋮
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-b border-gray-100">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                        </td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">test save</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">10</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">Me</td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">02/10/2026 at 5:52PM</td>
                        <td class="px-2 py-2 text-right border-b border-gray-100 cursor-pointer pr-4">
                            ⋮
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-b border-gray-100">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                        </td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">gggg</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">10</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">Me</td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">02/04/2026 at 5:49PM</td>
                        <td class="px-2 py-2 text-right border-b border-gray-100 cursor-pointer pr-4">
                            ⋮
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-b border-gray-100">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                        </td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">test full export</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">4059</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">Me</td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">02/02/2026 at 11:19AM</td>
                        <td class="px-2 py-2 text-right border-b border-gray-100 cursor-pointer pr-4">
                            ⋮
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-2 border-b border-gray-100">
                            <input type="checkbox" class="w-4 h-4 cursor-pointer">
                        </td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">denver 1</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">14</td>
                        <td class="px-4 py-2 text-right border-b border-gray-100">Me</td>
                        <td class="px-4 py-2 text-left border-b border-gray-100">01/23/2026 at 9:20AM</td>
                        <td class="px-2 py-2 text-right border-b border-gray-100 cursor-pointer pr-4">
                            ⋮
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="flex justify-between items-center text-gray-400 p-4 text-sm">
            <div>
                Show
                <input class="w-7 mx-1 py-1 text-center text-black border border-black rounded-xs" type="text"
                    value="5">
                of 5 results
            </div>

            <div class="py-1 px-2.5 mx-2 bg-green-100 text-black outline outline-green-300 rounded-full">
                1
            </div>
        </div>
    </div>

</body>

</html>
